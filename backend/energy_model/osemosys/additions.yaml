# Additions to the vendored OSeMOSYS Israel model (data/israel_energy_model.yaml): the demand sectors and
# supply options the dashboard has and the model lacked, so both cover the same union (src/data/catalog.json).
#
# ALL VALUES ARE SAMPLE DATA, in the model's own units and conventions (capex in $mn per model capacity unit,
# opex_variable per PJ of activity, emissions in tonnes per PJ), chosen to sit between the model's existing
# technologies. Replace them with sourced data before relying on the results.
#
# build.py merges this file onto the vendored model by id (an entry here replaces one with the same id there).
# `earliest_year` is ours, not tz-osemosys: build.py turns it into capacity_additional_max = 0 before that year
# (activity_annual_max = 0 for import technologies) and removes it.

commodities:
  - {id: ElecDataCentres}   # dashboard sector "ai"
  - {id: ElecPA}            # dashboard sector "pa" (Palestinian Authority)
  - {id: CleanFuel}         # imported clean liquid fuels (dashboard source "importClean")
  - {id: GeothermalHeat}    # free resource for deep geothermal

technologies:
  # ── demand ──────────────────────────────────────────────────────────────
  - id: DMD_ElecDataCentres
    operating_modes:
      - {id: STANDARD, input_activity_ratio: {Electricity: 1.0}, output_activity_ratio: {ElecDataCentres: 1.0}}
  - id: DMD_ElecPA
    operating_modes:
      - {id: STANDARD, input_activity_ratio: {Electricity: 1.0}, output_activity_ratio: {ElecPA: 1.0}}

  # ── supply options ──────────────────────────────────────────────────────
  - id: IMP_LNG                      # LNG import, dearer than the pipeline gas import
    earliest_year: 2035
    operating_modes:
      - {id: STANDARD, opex_variable: 11000, output_activity_ratio: {NaturalGas: 1.0}}
  - id: PWR_Solar_30                 # 30%-efficiency panels: utility solar profile, higher capex
    capacity_factor: {SUMMER_DAY: 0.3, SUMMER_NIGHT: 0.0, WINTER_DAY: 0.3, WINTER_NIGHT: 0.0, INTERMEDIATE_DAY: 0.3, INTERMEDIATE_NIGHT: 0.0}
    capex: 900
    opex_fixed: 15
    earliest_year: 2030
    operating_modes:
      - {id: STANDARD, opex_variable: 10, input_activity_ratio: {SolarRadiation: 1.0}, output_activity_ratio: {Electricity: 1.0}}
  - id: PWR_Solar_40                 # 40%-efficiency panels
    capacity_factor: {SUMMER_DAY: 0.3, SUMMER_NIGHT: 0.0, WINTER_DAY: 0.3, WINTER_NIGHT: 0.0, INTERMEDIATE_DAY: 0.3, INTERMEDIATE_NIGHT: 0.0}
    capex: 1000
    opex_fixed: 15
    earliest_year: 2035
    operating_modes:
      - {id: STANDARD, opex_variable: 10, input_activity_ratio: {SolarRadiation: 1.0}, output_activity_ratio: {Electricity: 1.0}}
  - id: IMP_GeothermalHeat
    operating_modes:
      - {id: STANDARD, output_activity_ratio: {GeothermalHeat: 1.0}}
  - id: PWR_Geothermal_Deep          # enhanced / deep geothermal
    capacity_factor: 0.85
    capex: 5000
    opex_fixed: 100
    earliest_year: 2035
    operating_modes:
      - {id: STANDARD, opex_variable: 20, input_activity_ratio: {GeothermalHeat: 1.0}, output_activity_ratio: {Electricity: 1.0}}
  - id: PWR_Fusion                   # fusion power: no fuel input in this model
    capacity_factor: 0.85
    capex: 10000
    opex_fixed: 150
    earliest_year: 2040
    operating_modes:
      - {id: STANDARD, opex_variable: 30, output_activity_ratio: {Electricity: 1.0}}
  - id: IMP_Electricity              # interconnector: capacity-limited like a plant
    capacity_factor: 0.6
    capex: 300
    earliest_year: 2030
    operating_modes:
      - {id: STANDARD, opex_variable: 16000, output_activity_ratio: {Electricity: 1.0}}
  - id: IMP_CleanFuels
    earliest_year: 2030
    operating_modes:
      - {id: STANDARD, opex_variable: 25000, output_activity_ratio: {CleanFuel: 1.0}}
  - id: CNV_CleanFuel_Diesel         # clean fuel as a drop-in for diesel; the negative CO2 offsets the vehicle's
    operating_modes:                 # tailpipe emission factor, which the model attaches to the vehicle
      - {id: STANDARD, input_activity_ratio: {CleanFuel: 1.0}, output_activity_ratio: {Diesel: 1.0}, emission_activity_ratio: {CO2: -74000}}
