name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
        with:
          path: dist

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # the 9 supply presets rebuilt in Python are byte-identical to the committed ones
      - run: python -m energy_model.fit_presets --check
      # unit tests, parity with the TypeScript engine (goldens), the schema mirror, the API and real OSeMOSYS solves
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # the same self-contained context that is uploaded to the Hugging Face Space
      - run: python scripts/deploy_hf_space.py --out build/hf-space
      - run: docker build -t energy-dashboard build/hf-space
      - name: smoke test
        run: |
          docker run -d --name app -p 7860:7860 energy-dashboard
          for i in $(seq 1 30); do curl -fs localhost:7860/api/health && break; sleep 2; done
          curl -fs localhost:7860/ | grep -q '<div id="root">'
          docker rm -f app

  deploy:
    needs: [build, python, docker]
    if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
