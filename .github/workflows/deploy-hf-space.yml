name: Deploy to Hugging Face Space

# Uploads the Docker build context to the Space after CI passes on the default branch (and on demand).
# Needs, in the GitHub repo settings: secret HF_TOKEN (write access to the Space) and variable HF_SPACE
# (<user>/<space>). Without HF_SPACE the job is skipped. One-time setup: deploy/hf-space/SETUP.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hf-space
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      vars.HF_SPACE != '' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == github.event.repository.default_branch))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install huggingface_hub
      - run: python scripts/deploy_hf_space.py --space "$HF_SPACE"
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
